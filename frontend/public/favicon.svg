<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#b20710"/>
    </linearGradient>
    <linearGradient id="filmGrad" x1="12" y1="8" x2="36" y2="40">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffd6d6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="48" height="48" rx="10" fill="url(#bgGrad)"/>
  <!-- Film strip left -->
  <rect x="8" y="6" width="6" height="36" rx="1.5" fill="url(#filmGrad)" opacity="0.9"/>
  <rect x="9" y="9" width="4" height="3" rx="0.5" fill="#e50914"/>
  <rect x="9" y="15" width="4" height="3" rx="0.5" fill="#e50914"/>
  <rect x="9" y="21" width="4" height="3" rx="0.5" fill="#e50914"/>
  <rect x="9" y="27" width="4" height="3" rx="0.5" fill="#e50914"/>
  <rect x="9" y="33" width="4" height="3" rx="0.5" fill="#e50914"/>
  <!-- Film strip right -->
  <rect x="34" y="6" width="6" height="36" rx="1.5" fill="url(#filmGrad)" opacity="0.9"/>
  <rect x="35" y="9" width="4" height="3" rx="0.5" fill="#e50914"/>
  <rect x="35" y="15" width="4" height="3" rx="0.5" fill="#e50914"/>
  <rect x="35" y="21" width="4" height="3" rx="0.5" fill="#e50914"/>
  <rect x="35" y="27" width="4" height="3" rx="0.5" fill="#e50914"/>
  <rect x="35" y="33" width="4" height="3" rx="0.5" fill="#e50914"/>
  <!-- Screen / play area -->
  <rect x="16" y="10" width="16" height="20" rx="2" fill="white" opacity="0.95"/>
  <!-- Play triangle -->
  <polygon points="21,16 21,26 30,21" fill="#e50914"/>
  <!-- MAX text -->
  <text x="24" y="40" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="8" fill="white" letter-spacing="1">MAX</text>
</svg>